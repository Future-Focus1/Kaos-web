<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open Kaos</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:16px/1.6 Arial,sans-serif;padding:40px 24px}main{max-width:400px;margin:12vh auto}img{width:54px;height:54px}h1{font-size:26px;line-height:1.2;margin-top:26px}p{color:#5f6368}a{display:inline-block;background:#1976d2;color:#fff;text-decoration:none;padding:13px 20px;border-radius:6px;margin:16px 0}small{display:block;color:#5f6368;margin-top:10px}
  </style>
</head>
<body>
  <main>
    <img src="/brand/icon.svg" alt="Kaos">
    <h1>Update System WebView</h1>
    <p>Kaos needs a recent Android System WebView to open. Update Android System WebView and Chrome, then reopen Kaos.</p>
    <a href="https://play.google.com/store/apps/details?id=com.google.android.webview">Update System WebView</a>
    <small>If everything is already updated, close and reopen Kaos. Your saved plans stay on this device.</small>
  </main>
</body>
</html>
